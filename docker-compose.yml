version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kavach-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=KavachAI Threat Inspector
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - RDAP_TIMEOUT_SECONDS=4.0
    networks:
      - kavach-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kavach-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - kavach-network

networks:
  kavach-network:
    driver: bridge
